[package]
name = "achievements-passport-desktop"
version = "0.1.0"
edition = "2021"
authors = ["MohandL3G"]
description = "A luxury gaming achievements passport generator desktop application built in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MohandL3G/achievements-passport-desktop"

[dependencies]
# UI Framework
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.29"

# Image processing & SVG rendering
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.44"
tiny-skia = "0.11"
usvg = "0.44"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File Dialogs & Utilities
rfd = "0.15"
open = "5.3"
dirs = "5.0"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
